version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "backend"
      - "security"
    groups:
      backend-patches:
        patterns:
          - "*"
        update-types:
          - "patch"
      backend-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "frontend"
      - "security"
    groups:
      frontend-patches:
        patterns:
          - "*"
        update-types:
          - "patch"
      frontend-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
    commit-message:
      prefix: "chore"
      include: "scope"
