version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "backend"
      - "security"
    groups:
      backend-patches:
        patterns:
          - "*"
        update-types:
          - "patch"
      backend-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "frontend"
      - "security"
    groups:
      frontend-patches:
        patterns:
          - "*"
        update-types:
          - "patch"
      frontend-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "npm"
    directory: "/mobile"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "mobile"
      - "security"
    groups:
      mobile-patches:
        patterns:
          - "*"
        update-types:
          - "patch"
      mobile-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "github-actions"
      - "security"
    groups:
      github-actions-patches:
        patterns:
          - "*"
        update-types:
          - "patch"
      github-actions-minor:
        patterns:
          - "*"
        update-types:
          - "minor"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "docker"
      - "security"
    groups:
      docker-patches:
        patterns:
          - "*"
        update-types:
          - "patch"
      docker-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
