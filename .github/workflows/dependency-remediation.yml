name: Dependency remediation

on:
  workflow_run:
    workflows: ["CI Tests", "Dependency validation", "Cloud Run Deployment"]
    types: [completed]
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Inspect without creating tasks, requesting reviews, or merging.
        type: boolean
        default: true
      scan_alerts:
        description: Inspect alerts and prepare Copilot tasks.
        type: boolean
        default: true

concurrency:
  group: dependency-automation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  orchestrate:
    if: vars.ENABLE_DEPENDENCY_AUTOMATION == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout trusted default branch only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Check automation identity
        env:
          AUTOMATION_TOKEN: ${{ secrets.DEPENDENCY_AUTOMATION_TOKEN }}
        run: |
          test -n "$AUTOMATION_TOKEN" || { echo '::error::Configure DEPENDENCY_AUTOMATION_TOKEN using docs/security/DEPENDENCY_AUTOMATION_SETUP.md'; exit 1; }
      - name: Remediate, review and merge dependency updates
        uses: actions/github-script@v7
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || github.event_name != 'workflow_dispatch' && false }}
          SCAN_ALERTS: ${{ github.event_name != 'workflow_dispatch' || inputs.scan_alerts }}
        with:
          github-token: ${{ secrets.DEPENDENCY_AUTOMATION_TOKEN }}
          script: |
            await require('./.github/scripts/dependency-automation.js').run({
              github, context, core,
              dryRun: process.env.DRY_RUN === 'true',
              scanAlerts: process.env.SCAN_ALERTS === 'true',
            });
