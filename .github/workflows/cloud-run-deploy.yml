name: Cloud Run Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: Optional image tag override. Defaults to the Git SHA.
        required: false
        default: ""
      deploy_production:
        description: Allow production rollout after staging verification.
        required: false
        type: boolean
        default: false
      staging_only:
        description: Skip production deployment and stop after staging verification.
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

env:
  GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
  GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
  ALERT_EMAIL_RECIPIENTS: ${{ vars.ALERT_EMAIL_RECIPIENTS || secrets.DEPLOY_NOTIFICATION_EMAIL }}
  ARTIFACT_REPO: my-skool-club
  IMAGE_NAME: myskoolclub
  SERVICE_NAME: my-skool-club-app
  STAGING_SERVICE_NAME: my-skool-club-app-staging
  MIGRATION_JOB_NAME: my-skool-club-app-db-migrate
  CLOUD_SQL_INSTANCE: my-skool-club-db
  DB_NAME: myskoolclub
  VPC_NETWORK_NAME: my-skool-club-vpc
  VPC_SUBNET_NAME: my-skool-club-run
  PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL || 'https://myskoolclub.com' }}
  MAIL_HOST: smtp.gmail.com
  MAIL_PORT: '587'
  MAIL_SMTP_AUTH: 'true'
  MAIL_STARTTLS: 'true'
  MAIL_STARTTLS_REQUIRED: 'true'
  MAIL_FROM: ${{ vars.MAIL_FROM || 'support@myskoolclub.com' }}
  OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4o-mini' }}
  OPENAI_API_URL: ${{ vars.OPENAI_API_URL || 'https://api.openai.com/v1/chat/completions' }}
  FIREBASE_PROJECT_ID: my-skool-club-web

jobs:
  validate:
    uses: ./.github/workflows/ci-tests.yml

  build-and-publish:
    name: Build immutable Cloud Run image
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify required deployment configuration
        shell: bash
        run: |
          test -n "${GCP_PROJECT_ID}" || { echo "Missing repository variable GCP_PROJECT_ID"; exit 1; }
          test -n "${GCP_SERVICE_ACCOUNT_EMAIL}" || { echo "Missing secret GCP_SERVICE_ACCOUNT_EMAIL"; exit 1; }
          test -n "${GCP_WORKLOAD_IDENTITY_PROVIDER}" || { echo "Missing secret GCP_WORKLOAD_IDENTITY_PROVIDER"; exit 1; }

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Enforce deployment kill switch
        env:
          DEPLOYMENT_KILL_SWITCH: ${{ vars.DEPLOYMENT_KILL_SWITCH || 'disabled' }}
        shell: bash
        run: |
          node .github/scripts/deployment-kill-switch.js --state "${DEPLOYMENT_KILL_SWITCH}" --mode check

      - name: Configure Docker for Artifact Registry
        shell: bash
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build and push immutable image
        id: image
        shell: bash
        run: |
          IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REPO}/${IMAGE_NAME}"
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || github.sha }}"
          if [[ -z "${TAG}" ]]; then
            TAG="${GITHUB_SHA}"
          fi

          docker build --platform linux/amd64 -t "${IMAGE}:${TAG}" .
          docker push "${IMAGE}:${TAG}"
          DIGEST="$(docker image inspect --format='{{index .RepoDigests 0}}' "${IMAGE}:${TAG}")"

          echo "image=${IMAGE}:${TAG}" >> "$GITHUB_OUTPUT"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Verify frontend bundle in image
        shell: bash
        run: |
          IMAGE="${{ steps.image.outputs.image }}"
          CONTAINER_ID="$(docker create "${IMAGE}")"
          trap 'docker rm -f "${CONTAINER_ID}" >/dev/null 2>&1 || true' EXIT
          docker cp "${CONTAINER_ID}:/app/app.jar" /tmp/app.jar
          unzip -Z1 /tmp/app.jar | grep -qx 'BOOT-INF/classes/static/index.html'
          unzip -Z1 /tmp/app.jar | grep -Eq '^BOOT-INF/classes/static/assets/[^/].*'
          echo "The deployment image contains the compiled frontend bundle."

  deploy-staging:
    name: Staging validation deployment
    needs: build-and-publish
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy staging Cloud Run service
        shell: bash
        env:
          IMAGE: ${{ needs.build-and-publish.outputs.image }}
        run: |
          gcloud run deploy "${STAGING_SERVICE_NAME}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --image="${IMAGE}" \
            --platform=managed \
            --service-account="${GCP_SERVICE_ACCOUNT_EMAIL}" \
            --set-cloudsql-instances="${GCP_PROJECT_ID}:${GCP_REGION}:${CLOUD_SQL_INSTANCE}" \
            --network="${VPC_NETWORK_NAME}" \
            --subnet="${VPC_SUBNET_NAME}" \
            --vpc-egress=private-ranges-only \
            --set-env-vars="SPRING_PROFILES_ACTIVE=prod,EMAIL_VERIFICATION_ENABLED=true,CLOUD_SQL_INSTANCE=${GCP_PROJECT_ID}:${GCP_REGION}:${CLOUD_SQL_INSTANCE},DB_NAME=${DB_NAME},DB_MAX_POOL_SIZE=5,FRONTEND_URL=${PUBLIC_BASE_URL},MAIL_HOST=${MAIL_HOST},MAIL_PORT=${MAIL_PORT},MAIL_SMTP_AUTH=${MAIL_SMTP_AUTH},MAIL_STARTTLS=${MAIL_STARTTLS},MAIL_STARTTLS_REQUIRED=${MAIL_STARTTLS_REQUIRED},MAIL_FROM=${MAIL_FROM},OPENAI_MODEL=${OPENAI_MODEL},OPENAI_API_URL=${OPENAI_API_URL},FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}" \
            --set-secrets="DB_USERNAME=db-username:latest,DB_PASSWORD=db-password:latest,MAIL_USERNAME=mail-username:latest,MAIL_PASSWORD=mail-password:latest,OPENAI_API_KEY=openai-api-key:latest" \
            --no-invoker-iam-check \
            --execution-environment=gen2 \
            --port=8080 \
            --memory=1Gi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=10 \
            --concurrency=100 \
            --timeout=300

      - name: Verify staging health endpoint
        shell: bash
        run: |
          STAGING_URL="$(gcloud run services describe "${STAGING_SERVICE_NAME}" --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" --format='value(status.url)')"
          curl -fsS --retry 10 --retry-delay 5 --retry-connrefused "${STAGING_URL}/api/health"

  deploy-production:
    name: Production rollout
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_AUTOMATIC_PRODUCTION_DEPLOY == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy_production == true)
    needs: [build-and-publish, deploy-staging]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Run database migration job
        shell: bash
        env:
          IMAGE: ${{ needs.build-and-publish.outputs.image }}
        run: |
          gcloud run jobs deploy "${MIGRATION_JOB_NAME}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --image="${IMAGE}" \
            --service-account="${GCP_SERVICE_ACCOUNT_EMAIL}" \
            --set-cloudsql-instances="${GCP_PROJECT_ID}:${GCP_REGION}:${CLOUD_SQL_INSTANCE}" \
            --network="${VPC_NETWORK_NAME}" \
            --subnet="${VPC_SUBNET_NAME}" \
            --vpc-egress=private-ranges-only \
            --set-env-vars="SPRING_PROFILES_ACTIVE=prod,CLOUD_SQL_INSTANCE=${GCP_PROJECT_ID}:${GCP_REGION}:${CLOUD_SQL_INSTANCE},DB_NAME=${DB_NAME},DB_MAX_POOL_SIZE=2" \
            --set-secrets="DB_USERNAME=db-username:latest,DB_PASSWORD=db-password:latest" \
            --args="--spring.main.web-application-type=none,--app.database.migration-only=true" \
            --tasks=1 \
            --max-retries=0 \
            --task-timeout=10m \
            --memory=1Gi \
            --cpu=1 \
            --quiet

          gcloud run jobs execute "${MIGRATION_JOB_NAME}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --wait \
            --quiet

      - name: Deploy production Cloud Run service
        shell: bash
        env:
          IMAGE: ${{ needs.build-and-publish.outputs.image }}
        run: |
          gcloud run deploy "${SERVICE_NAME}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --image="${IMAGE}" \
            --platform=managed \
            --service-account="${GCP_SERVICE_ACCOUNT_EMAIL}" \
            --set-cloudsql-instances="${GCP_PROJECT_ID}:${GCP_REGION}:${CLOUD_SQL_INSTANCE}" \
            --network="${VPC_NETWORK_NAME}" \
            --subnet="${VPC_SUBNET_NAME}" \
            --vpc-egress=private-ranges-only \
            --set-env-vars="SPRING_PROFILES_ACTIVE=prod,EMAIL_VERIFICATION_ENABLED=true,CLOUD_SQL_INSTANCE=${GCP_PROJECT_ID}:${GCP_REGION}:${CLOUD_SQL_INSTANCE},DB_NAME=${DB_NAME},DB_MAX_POOL_SIZE=5,FRONTEND_URL=${PUBLIC_BASE_URL},MAIL_HOST=${MAIL_HOST},MAIL_PORT=${MAIL_PORT},MAIL_SMTP_AUTH=${MAIL_SMTP_AUTH},MAIL_STARTTLS=${MAIL_STARTTLS},MAIL_STARTTLS_REQUIRED=${MAIL_STARTTLS_REQUIRED},MAIL_FROM=${MAIL_FROM},OPENAI_MODEL=${OPENAI_MODEL},OPENAI_API_URL=${OPENAI_API_URL},FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}" \
            --set-secrets="DB_USERNAME=db-username:latest,DB_PASSWORD=db-password:latest,MAIL_USERNAME=mail-username:latest,MAIL_PASSWORD=mail-password:latest,OPENAI_API_KEY=openai-api-key:latest" \
            --no-invoker-iam-check \
            --execution-environment=gen2 \
            --port=8080 \
            --memory=1Gi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=10 \
            --concurrency=100 \
            --timeout=300

      - name: Verify production health endpoint
        id: healthcheck
        continue-on-error: true
        shell: bash
        run: |
          PRODUCTION_URL="$(gcloud run services describe "${SERVICE_NAME}" --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" --format='value(status.url)')"
          curl -fsS --retry 12 --retry-delay 5 --retry-connrefused "${PRODUCTION_URL}/api/health"

      - name: Roll back failed production revision
        if: steps.healthcheck.outcome != 'success'
        shell: bash
        run: |
          PREVIOUS_REVISION="$(gcloud run revisions list --service="${SERVICE_NAME}" --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" --format='value(metadata.name)' --sort-by='~metadata.creationTimestamp' --limit=2 | tail -n +2 | head -n 1)"
          if [[ -n "${PREVIOUS_REVISION}" ]]; then
            gcloud run services update-traffic "${SERVICE_NAME}" \
              --project="${GCP_PROJECT_ID}" \
              --region="${GCP_REGION}" \
              --to-revisions="${PREVIOUS_REVISION}=100"
            echo "Production deployment failed health validation and was rolled back to ${PREVIOUS_REVISION}."
            exit 1
          fi
          echo "Production deployment failed health validation but there was no previous revision to roll back to." >&2
          exit 1

  notify:
    name: Deployment outcome notification
    needs: [validate, build-and-publish, deploy-staging, deploy-production]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Publish deployment summary to GitHub Actions
        shell: bash
        run: |
          STATUS="${{ needs.deploy-production.result == 'success' && 'SUCCESS' || needs.deploy-staging.result == 'success' && 'STAGING_SUCCESS' || 'FAILED' }}"
          echo "Deployment status: ${STATUS}"
          echo "Service: ${SERVICE_NAME}"
          echo "Image: ${{ needs.build-and-publish.outputs.image || 'not built' }}"

      - name: Send Slack notification
        if: ${{ secrets.SLACK_WEBHOOK_URL != '' }}
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "text": "MySkoolClub deployment status: ${{ needs.deploy-production.result == 'success' && 'production deployed successfully' || needs.deploy-staging.result == 'success' && 'staging validated successfully' || 'deployment failed' }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Send owner email notification
        if: ${{ env.ALERT_EMAIL_RECIPIENTS != '' }}
        shell: bash
        run: |
          echo "Deployment status for MySkoolClub is available in the GitHub Actions run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          echo "Notification email target configured: ${ALERT_EMAIL_RECIPIENTS}"
