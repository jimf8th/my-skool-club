name: Dependency validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify automation policy
        run: node --test .github/scripts/dependency-automation.test.js
      - name: Explain merge gate
        run: |
          echo 'Dependency remediation and merging run from trusted main code after CI completes.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Every automated merge requires current-head tests, an actual approval, resolved review threads, and branch protection.' >> "$GITHUB_STEP_SUMMARY"
