name: Dependency validation

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write

jobs:
  preflight:
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' || github.actor == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    outputs:
      changed_files: ${{ steps.file-scan.outputs.files }}
      classification: ${{ steps.classify.outputs.classification }}
      auto_merge_eligible: ${{ steps.classify.outputs.auto_merge_eligible }}
      update_type: ${{ steps.metadata.outputs.update-type }}
      ecosystem: ${{ steps.metadata.outputs.package-ecosystem }}
      dependency_names: ${{ steps.metadata.outputs.dependency-names }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Identify changed files
        id: file-scan
        shell: bash
        run: |
          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.event.pull_request.head.sha }}"
          files=$(git diff --name-only "$base_sha" "$head_sha" | tr '\n' ' ')
          echo "files=$files" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$files"

      - name: Classify dependency risk
        id: classify
        env:
          CHANGED_FILES: ${{ steps.file-scan.outputs.files }}
          PACKAGE_NAMES: ${{ steps.metadata.outputs.dependency-names }}
          ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          SECURITY_SEVERITY: ${{ steps.metadata.outputs.alert-severity || 'unknown' }}
        run: |
          node .github/scripts/classify-dependency-risk.js --files "$CHANGED_FILES" --package-names "$PACKAGE_NAMES" --ecosystem "$ECOSYSTEM" --update-type "$UPDATE_TYPE"
          node .github/scripts/classify-dependency-risk.js --files "$CHANGED_FILES" --package-names "$PACKAGE_NAMES" --ecosystem "$ECOSYSTEM" --update-type "$UPDATE_TYPE" > /tmp/risk.json
          classification=$(node -p "require('/tmp/risk.json').classification")
          auto_merge=$(node -p "require('/tmp/risk.json').autoMergeEligible")
          echo "classification=$classification" >> "$GITHUB_OUTPUT"
          echo "auto_merge_eligible=$auto_merge" >> "$GITHUB_OUTPUT"

  test-suite:
    needs: preflight
    if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.classification != 'BLOCKED' }}
    uses: ./.github/workflows/ci-tests.yml

  review-gate:
    needs: [preflight, test-suite]
    if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.classification != 'LOW' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const prNumber = context.issue.number;
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            const labels = (pr.labels || []).map((l) => String(l.name || '').toLowerCase());
            const hasCopilotReviewedLabel = labels.includes('copilot-reviewed');

            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              per_page: 100,
            });

            const approvedByHuman = reviews.some((review) => {
              const login = String(review?.user?.login || '');
              return review.state === 'APPROVED' && !login.endsWith('[bot]');
            });

            if (!approvedByHuman && !hasCopilotReviewedLabel) {
              core.setFailed('MEDIUM/HIGH dependency updates require either a human APPROVED review or the copilot-reviewed label before merge.');
            }

  report-result:
    needs: [preflight, test-suite, review-gate]
    if: ${{ always() && needs.preflight.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const risk = '${{ needs.preflight.outputs.classification }}';
            const autoMerge = '${{ needs.preflight.outputs.auto_merge_eligible }}';
            const tests = '${{ needs.test-suite.result }}';
            const reviewGate = '${{ needs.review-gate.result || 'not-required' }}';
            const ecosystem = '${{ needs.preflight.outputs.ecosystem || 'unknown' }}';
            const updateType = '${{ needs.preflight.outputs.update_type || 'unknown' }}';
            const summary = [
              '## Dependency validation summary',
              '',
              `- Ecosystem: **${ecosystem}**`,
              `- Update type: **${updateType}**`,
              `- Risk classification: **${risk}**`,
              `- Auto-merge eligible: **${autoMerge}**`,
              `- CI test result: **${tests}**`,
              `- Review gate: **${reviewGate}**`,
              '',
              'If the risk is MEDIUM or HIGH, the PR remains blocked until a human approval or copilot-reviewed label is present.',
              'If the CI job fails, the dependency update is not eligible for auto-merge.'
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: summary,
            }).catch(() => {});

  auto-merge:
    needs: [preflight, test-suite]
    if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.auto_merge_eligible == 'true' && needs.test-suite.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Enable native auto-merge for eligible low-risk PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr view "${{ github.event.pull_request.number }}" --json number,title,mergeStateStatus,autoMergeRequest >/tmp/pr.json || true
          if grep -q 'null' /tmp/pr.json 2>/dev/null; then
            echo "Native auto-merge is not enabled for this repository. Configure GitHub auto-merge or repository rules to allow it."
            exit 0
          fi
          gh pr merge "${{ github.event.pull_request.number }}" --auto --merge --delete-branch || {
            echo "Auto-merge was not enabled or branch protection prevented it; the PR remains manual."
            exit 0
          }
