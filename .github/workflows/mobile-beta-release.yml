name: Mobile beta release

on:
  workflow_run:
    workflows: ["Cloud Run Deployment"]
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Plan releases without builds, submissions, or release records.
        type: boolean
        default: true
      force_release:
        description: Release even when mobile inputs have not changed.
        type: boolean
        default: false

concurrency:
  group: mobile-beta-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (vars.ENABLE_MOBILE_BETA_RELEASE == 'true' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      sha: ${{ steps.plan.outputs.sha }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Plan releases and check credentials
        id: plan
        uses: actions/github-script@v7
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          FORCE_RELEASE: ${{ inputs.force_release }}
        with:
          script: |
            const { execFileSync } = require('node:child_process');
            const sha = execFileSync('git', ['rev-parse', 'HEAD'], {encoding:'utf8'}).trim();
            const event = context.payload.workflow_run;
            if (event && sha !== event.head_sha) {
              core.setOutput('release', 'false');
              await core.summary.addRaw('A newer main commit exists; its deployment will schedule mobile releases.').write();
              return;
            }
            const releases = await github.paginate(github.rest.repos.listReleases, {...context.repo, per_page:100});
            const platforms = [];
            for (const platform of ['ios','android']) {
              const prefix = `mobile-beta-${platform}-`;
              const exact = releases.find(r => r.tag_name === `${prefix}${sha}`);
              if (exact?.draft) {
                core.setFailed(`An unfinished ${platform} attempt exists. Inspect its EAS status before retrying; see setup guide.`);
                continue;
              }
              if (exact) continue;
              const previous = releases.find(r => r.tag_name.startsWith(prefix) && !r.draft);
              const previousSha = previous?.tag_name.slice(prefix.length);
              let changed = true;
              if (/^[a-f0-9]{40}$/.test(previousSha || '')) {
                const paths = execFileSync('git', ['diff','--name-only',previousSha,sha,'--','mobile/'], {encoding:'utf8'});
                changed = paths.trim().length > 0;
              }
              if (changed || process.env.FORCE_RELEASE === 'true') platforms.push(platform);
            }
            const dry = process.env.DRY_RUN === 'true';
            if (!dry && platforms.length && !process.env.EXPO_TOKEN) core.setFailed('Missing EXPO_TOKEN; follow the setup guide. No mobile build was started.');
            core.setOutput('matrix', JSON.stringify({platform:platforms}));
            core.setOutput('sha', sha);
            core.setOutput('release', String(!dry && platforms.length > 0 && !process.exitCode));
            await core.summary.addRaw(`Commit: ${sha}\n\nPlanned platforms: ${platforms.join(', ') || 'none'}\n\nDry run: ${dry}\n\nExpo token configured: ${Boolean(process.env.EXPO_TOKEN)}`).write();

  validate:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    uses: ./.github/workflows/ci-tests.yml

  release:
    needs: [plan, validate]
    if: needs.plan.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    environment: mobile-beta
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
        working-directory: mobile
      - name: Reserve release attempt
        id: record
        uses: actions/github-script@v7
        env:
          PLATFORM: ${{ matrix.platform }}
          RELEASE_SHA: ${{ needs.plan.outputs.sha }}
        with:
          script: |
            const tag = `mobile-beta-${process.env.PLATFORM}-${process.env.RELEASE_SHA}`;
            const result = await github.rest.repos.createRelease({...context.repo, tag_name:tag,
              target_commitish:process.env.RELEASE_SHA, name:tag, draft:true, prerelease:true,
              body:`Submission in progress. Inspect GitHub run ${context.runId} and EAS before retrying. This draft prevents duplicate submissions.`});
            core.setOutput('id', String(result.data.id));
      - name: Build, test on a device, and submit the exact production build
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          PLATFORM: ${{ matrix.platform }}
        run: npx --yes eas-cli@27.5.0 workflow:run "beta-${PLATFORM}.yml" --non-interactive --wait --json > "$RUNNER_TEMP/eas-workflow.json"
      - name: Publish submission record
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ steps.record.outputs.id }}
          PLATFORM: ${{ matrix.platform }}
          RELEASE_SHA: ${{ needs.plan.outputs.sha }}
        with:
          script: |
            const destination = process.env.PLATFORM === 'ios' ? 'TestFlight' : 'Google Play internal testing';
            await github.rest.repos.updateRelease({...context.repo, release_id:Number(process.env.RELEASE_ID), draft:false,
              body:`Commit ${process.env.RELEASE_SHA} passed CI and native Maestro public-auth smoke tests. EAS built and submitted to ${destination}. Store processing is separate from successful upload.\n\nGitHub run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
      - name: Preserve EAS run output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eas-${{ matrix.platform }}-${{ needs.plan.outputs.sha }}
          path: ${{ runner.temp }}/eas-workflow.json
          if-no-files-found: ignore
