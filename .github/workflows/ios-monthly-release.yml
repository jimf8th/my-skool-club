name: Monthly iOS Release

on:
  schedule:
    - cron: '0 16 * * 6'
  workflow_dispatch:
    inputs:
      force_release:
        description: Force a release even if the repo appears unchanged.
        required: false
        type: boolean
        default: false
      dry_run:
        description: Validate the release process without submitting to Apple.
        required: false
        type: boolean
        default: true

concurrency:
  group: ios-monthly-release
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  release-gate:
    name: Decide if a mobile release is necessary
    runs-on: ubuntu-latest
    outputs:
      release_decision: ${{ steps.decide.outputs.release_decision }}
      release_risk: ${{ steps.decide.outputs.release_risk }}
      release_reason: ${{ steps.decide.outputs.release_reason }}
      relevant_files: ${{ steps.decide.outputs.relevant_files }}
      is_first_saturday: ${{ steps.schedule.outputs.is_first_saturday }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect first-Saturday scheduling window
        id: schedule
        shell: bash
        run: |
          DAY_OF_MONTH="$(date -u +%d)"
          DAY_OF_WEEK="$(date -u +%u)"
          if [[ "$DAY_OF_WEEK" == "6" ]] && (( 10#$DAY_OF_MONTH <= 7 )); then
            echo "is_first_saturday=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_first_saturday=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip non-first-Saturday scheduled runs
        if: github.event_name == 'schedule' && steps.schedule.outputs.is_first_saturday != 'true'
        shell: bash
        run: |
          echo "This scheduled run is outside the first-Saturday window; release evaluation is skipped."
          echo "release_decision=skip" >> "$GITHUB_OUTPUT"
          echo "release_risk=LOW" >> "$GITHUB_OUTPUT"
          echo "release_reason=Not the first Saturday of the month; no release run scheduled." >> "$GITHUB_OUTPUT"
          echo "relevant_files=" >> "$GITHUB_OUTPUT"

      - name: Check whether a release is necessary
        id: decide
        if: github.event_name == 'workflow_dispatch' || steps.schedule.outputs.is_first_saturday == 'true'
        shell: bash
        run: |
          node .github/scripts/ios-release-risk.js

  skip-release:
    name: Skip release when no relevant update exists
    needs: release-gate
    if: needs.release-gate.outputs.release_decision == 'skip'
    runs-on: ubuntu-latest
    steps:
      - name: Notify owner that no release was required
        shell: bash
        run: |
          echo "Release skipped: ${RELEASE_REASON}"
          echo "Relevant files: ${RELEVANT_FILES}"
        env:
          RELEASE_REASON: ${{ needs.release-gate.outputs.release_reason }}
          RELEVANT_FILES: ${{ needs.release-gate.outputs.relevant_files }}

  mobile-regression-tests:
    name: Run mobile regression suite
    needs: release-gate
    if: needs.release-gate.outputs.release_decision == 'proceed'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        run: npm ci

      - name: Run Jest suite and coverage
        run: npm run test:ci

      - name: Run Maestro smoke if available
        if: ${{ hashFiles('mobile/e2e/maestro/**') != '' }}
        shell: bash
        run: |
          if command -v maestro >/dev/null 2>&1; then
            npm run e2e:smoke || exit 1
          else
            echo "Maestro is not installed in this runner; this release gate cannot complete device automation here."
            exit 1
          fi

      - name: Upload mobile test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-release-test-reports
          path: |
            mobile/coverage/
            mobile/test-results/

  eas-production-build:
    name: Build production iOS archive via EAS
    needs: [release-gate, mobile-regression-tests]
    if: needs.release-gate.outputs.release_decision == 'proceed' && (vars.ENABLE_IOS_AUTOMATIC_RELEASE == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        run: npm ci

      - name: Install Expo EAS CLI
        run: npm install -g eas-cli

      - name: Create production iOS build
        id: build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          ASC_APP_ID: ${{ secrets.ASC_APP_ID || vars.ASC_APP_ID }}
          EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID || vars.EAS_PROJECT_ID || '543ebf4b-fa14-4d36-a40e-a90fb85c6538' }}
        shell: bash
        run: |
          if [[ -z "${EXPO_TOKEN}" ]]; then
            echo "EXPO_TOKEN is required for automated EAS builds."
            exit 1
          fi
          eas build --platform ios --profile production --non-interactive --wait --json > eas-build.json
          node - <<'NODE'
          const fs = require('fs');
          const json = JSON.parse(fs.readFileSync('eas-build.json', 'utf8'));
          const value = Array.isArray(json) ? json[0] : json;
          const id = value && (value.id || value.build?.id || value.buildId || value.data?.id);
          if (!id) {
            throw new Error('Could not determine the EAS build ID from the CLI output.');
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `build_id=${id}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `build_url=${value.url || value.build?.url || ''}\n`);
          console.log(JSON.stringify({ buildId: id, url: value.url || value.build?.url || '' }, null, 2));
          NODE

      - name: Update release manifest with EAS build metadata
        env:
          BUILD_ID: ${{ steps.build.outputs.build_id }}
          BUILD_URL: ${{ steps.build.outputs.build_url }}
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const manifestPath = path.resolve('.github', 'ios-release-manifest.json');
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          const now = new Date().toISOString();
          manifest.lastReleaseCheck = now;
          manifest.status = 'build-created';
          manifest.lastBuild = {
            buildId: process.env.BUILD_ID || null,
            buildUrl: process.env.BUILD_URL || null,
            createdAt: now,
            gitCommit: process.env.GITHUB_SHA || null,
          };
          fs.writeFileSync(manifestPath, JSON.stringify(manifest, null, 2) + '\n');
          NODE

  notify-release-blocked:
    name: Notify blocked or skipped release
    needs: [release-gate, mobile-regression-tests]
    if: always() && needs.release-gate.outputs.release_decision == 'proceed' && needs.mobile-regression-tests.result == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Notify owner of blocked release
        shell: bash
        run: |
          echo "The iOS release was blocked by failing mobile regression tests."
          echo "Risk: ${RISK}"
          echo "Reason: ${REASON}"
        env:
          RISK: ${{ needs.release-gate.outputs.release_risk }}
          REASON: ${{ needs.release-gate.outputs.release_reason }}
