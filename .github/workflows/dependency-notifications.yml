name: Dependency notifications

on:
  workflow_run:
    workflows:
      - "Dependency validation"
      - "Dependency security report"
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Publish GitHub-native notification summary
        uses: actions/github-script@v9
        with:
          script: |
            const workflow = context.payload.workflow_run;
            const conclusion = workflow?.conclusion || 'success';
            const name = workflow?.name || 'dependency workflow';
            const url = workflow?.html_url || `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions`;
            const title = conclusion === 'success' ? 'Dependency automation succeeded' : 'Dependency automation requires attention';
            const body = [
              `## ${title}`,
              '',
              `- Workflow: **${name}**`,
              `- Result: **${conclusion}**`,
              `- Run URL: ${url}`,
              '',
              'Review the run logs and PR status before merging or redeploying any dependency update.'
            ].join('\n');

            core.summary.addRaw(body).write();

            if (context.payload.pull_request) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body,
              }).catch(() => {});
            }
