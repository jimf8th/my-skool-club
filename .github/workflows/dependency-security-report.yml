name: Dependency security report

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  security-events: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Export security report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p .github/reports
          gh api \
            -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/dependabot/alerts \
            --paginate > .github/reports/dependabot-alerts.json || true

          cat <<'EOF' > .github/reports/DEPENDENCY_SECURITY_REPORT.md
          # Dependency Security Report

          This report is generated by the scheduled dependency security workflow.

          ## Open Dependabot alerts

          See `.github/reports/dependabot-alerts.json` for the raw data.

          ## Summary expectations

          - Open security alerts should be reviewed by package and application owner.
          - Critical and high severity issues require fast remediation.
          - Low-risk dependency updates may remain eligible for auto-merge only after full validation runs.
          - Manual repository settings still control GitHub security alert visibility and auto-merge.
          EOF

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-security-report
          path: .github/reports/
