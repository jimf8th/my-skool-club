name: Operational health report

on:
  schedule:
    - cron: '15 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  summarize-health:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate operational summary
        id: summary
        env:
          HEALTH_STATUS: degraded
          DEPENDENCY_VULNS: '0'
          DEPLOYMENTS: '0'
          ROLLBACKS: '0'
          MOBILE_RELEASES: '0'
          ALERTS: '0'
        run: |
          node .github/scripts/automation-health-summary.js \
            --status "${HEALTH_STATUS}" \
            --dependency-vulns "${DEPENDENCY_VULNS}" \
            --deployments "${DEPLOYMENTS}" \
            --rollbacks "${ROLLBACKS}" \
            --mobile-releases "${MOBILE_RELEASES}" \
            --alerts "${ALERTS}"

      - name: Publish the summary to workflow logs
        uses: actions/github-script@v7
        with:
          script: |
            const summary = `${{ steps.summary.outputs.summary }}`;
            core.info(summary);
