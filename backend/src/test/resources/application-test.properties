spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop

# Disable Flyway in tests — H2 handles schema via ddl-auto
spring.flyway.enabled=false

app.jwt.secret=test-secret-key-for-unit-tests-only-32chars!
app.jwt.expiration-ms=3600000

# Automated tests exercise the production verification behavior with an
# in-process email capture; they never contact an SMTP server.
app.email-verification.enabled=true
