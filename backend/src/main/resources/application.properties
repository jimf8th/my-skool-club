spring.application.name=my-skool-club
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
server.port=${PORT:8080}

# JPA
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Firebase Authentication — ID-token issuer/audience and Admin SDK project
app.firebase.project-id=${FIREBASE_PROJECT_ID:my-skool-club-web}

# Frontend URL (used in email verification links)
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.mobile-scheme=${MOBILE_APP_SCHEME:myskoolclub}
app.email-verification.enabled=${EMAIL_VERIFICATION_ENABLED:true}

# Email (SMTP)
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS_REQUIRED:false}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT_MS:10000}
spring.mail.properties.mail.smtp.timeout=${MAIL_TIMEOUT_MS:10000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_TIMEOUT_MS:10000}
app.mail.from=${MAIL_FROM:support@myskoolclub.com}

# OpenAI (used for AI-assisted receipt scanning on invoices)
app.openai.api-key=${OPENAI_API_KEY:}
app.openai.model=${OPENAI_MODEL:gpt-4o-mini}
app.openai.api-url=${OPENAI_API_URL:https://api.openai.com/v1/chat/completions}
