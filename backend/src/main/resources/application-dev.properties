spring.datasource.url=jdbc:postgresql://localhost:5432/myskoolclub_dev
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Local registrations are immediately verified; no email service is contacted.
app.email-verification.enabled=${EMAIL_VERIFICATION_ENABLED:false}
app.mobile-scheme=${MOBILE_APP_SCHEME:myskoolclub-dev}

logging.level.com.myskoolclub=DEBUG
